<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clay prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F3EEE6; --surface:#FFFDF9; --well:#E9E2D7; --ink:#1E1A16; --inkSoft:#5B534B; --muted:#9A9086; --line:rgba(30,26,22,.09);
  --accent:#C65A35; --accentSoft:#F5E2D7; --onAccent:#FFF8F2; --success:#3E8E6C; --warning:#C98A1E; --danger:#C2412F;
  --n-bg:#15120F; --n-surface:#221D18; --n-ink:#F6EFE6; --n-muted:#8C8277; --n-line:rgba(246,239,230,.12);
  --g-celadon:#DCE8DF; --g-cobalt:#DCE2F4; --g-ochre:#F3E4C6; --g-rose:#F2DCD5; --g-ash:#E5E0D9; --g-lilac:#E6DFEE;
  --m-change:#3457D5; --m-broken:#E0483A; --m-keep:#2E9A72;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;
  --slab:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -12px rgba(60,40,20,.28),0 2px 6px -2px rgba(60,40,20,.10);
  --pebble:0 8px 20px -8px rgba(40,25,10,.35),0 1px 3px rgba(40,25,10,.12);
  --settle:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#D9D1C5;font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:48px;min-height:100vh;padding:24px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.side{width:260px;align-self:center}
.side h1{font-family:var(--serif);font-weight:400;font-size:44px;margin:0;letter-spacing:-.6px}
.side p{color:var(--inkSoft);font-size:14px;line-height:20px;margin:6px 0 18px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{text-align:left;padding:9px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--inkSoft)}
.side nav button.on{background:var(--surface);color:var(--ink);box-shadow:var(--slab)}
.side .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:17px}
.side .reset{margin-top:10px;font-size:12px;font-weight:600;color:var(--accent)}
@media (max-width:760px){.side{display:none} body{padding:0;background:var(--canvas)}}

.phone{position:relative;width:393px;height:852px;border-radius:56px;background:#111;padding:10px;box-shadow:0 40px 80px -30px rgba(40,25,10,.5)}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--canvas)}
@media (max-width:760px){.phone{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font-weight:600;font-size:16px;z-index:50;pointer-events:none}
.status .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.status svg{display:block}
.dark .status{color:var(--n-ink)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:60;pointer-events:none}
.dark .home-ind{background:var(--n-ink)}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.enter{animation:enter .42s var(--settle) both}
.view.back{animation:back .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes back{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.rise>*{animation:rise .5s var(--settle) both}
.rise>*:nth-child(2){animation-delay:.06s}.rise>*:nth-child(3){animation-delay:.12s}.rise>*:nth-child(4){animation-delay:.18s}.rise>*:nth-child(5){animation-delay:.24s}.rise>*:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* squish */
.sq{transition:transform .38s var(--settle)}
.sq:active{transform:scale(1.02,.95);transition:transform .07s ease-out}
.sq.big:active{transform:scale(1.008,.975)}

.pad{padding:62px 20px 120px}
.hero{font-family:var(--serif);font-size:44px;line-height:46px;letter-spacing:-.6px}
.title{font-family:var(--serif);font-size:32px;line-height:36px;letter-spacing:-.3px}
.heading{font-family:var(--serif);font-size:24px;line-height:28px}
.eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.callout{font-size:14px;line-height:19px;font-weight:500;color:var(--inkSoft)}
.caption{font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
.tab{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap8{gap:8px}.gap12{gap:12px}

.slab{background:var(--surface);border-radius:24px;box-shadow:var(--slab)}
.wellbox{background:var(--well);border-radius:18px;box-shadow:inset 0 1px 2px rgba(60,40,20,.10)}
.pebble{background:var(--surface);border-radius:999px;box-shadow:var(--pebble);display:inline-flex;align-items:center;justify-content:center}
.ib{width:40px;height:40px}
.ib.sm{width:34px;height:34px}
.dark .pebble{background:var(--n-surface);color:var(--n-ink);box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}

.btn{height:50px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px}
.btn.ink{background:var(--ink);color:var(--onAccent);box-shadow:var(--pebble)}
.btn.accent{background:var(--accent);color:var(--onAccent);box-shadow:0 10px 22px -10px rgba(198,90,53,.8)}
.btn.sec{background:var(--surface);box-shadow:var(--slab)}
.btn.ghost{color:var(--inkSoft)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:38px;padding:0 15px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.dark .btn.sec{background:var(--n-surface);color:var(--n-ink);box-shadow:none}

.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--well);color:var(--inkSoft);white-space:nowrap}
.chip.accent{background:var(--accentSoft);color:var(--accent)}
.chip.warn{background:#F6E9CC;color:#8A5E0E}
.chip.danger{background:#F5DAD4;color:var(--danger)}
.chip.on{background:var(--ink);color:var(--onAccent)}
.chip .dot{width:7px;height:7px;border-radius:4px;background:currentColor}

.seg{display:flex;background:var(--well);border-radius:14px;padding:3px;position:relative}
.seg button{flex:1;height:34px;border-radius:11px;font-size:13px;font-weight:500;color:var(--inkSoft);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--ink);font-weight:600}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:11px;background:var(--surface);box-shadow:0 2px 6px rgba(60,40,20,.12);transition:left .38s var(--settle),width .38s var(--settle)}

.field{display:block;width:100%;height:50px;border-radius:16px;background:var(--well);border:0;padding:0 16px;font-size:16px;outline:none;box-shadow:inset 0 1px 2px rgba(60,40,20,.08)}
.field:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.field.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.err{color:var(--danger);font-size:13px;font-weight:500;margin-top:6px}

.ring{outline:2px solid var(--accent);outline-offset:3px}

/* Kneading */
.knead{width:14px;height:14px;background:var(--warning);border-radius:50% 45% 55% 50%;animation:knead 1.6s ease-in-out infinite}
.knead.lg{width:22px;height:22px;background:var(--onAccent)}
@keyframes knead{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(1.22,.8) rotate(20deg)}50%{transform:scale(.86,1.16) rotate(60deg);border-radius:45% 55% 50% 50%}75%{transform:scale(1.12,.9) rotate(100deg)}}
@media (prefers-reduced-motion:reduce){.knead{animation:fade 1.6s infinite}@keyframes fade{50%{opacity:.4}}.sq:active{transform:none}.rise>*,.view.enter{animation:none}}

/* home cards */
.wscard{overflow:hidden;border-radius:32px;margin-bottom:18px;cursor:pointer}
.wscard .wellarea{height:250px;position:relative;overflow:hidden;display:flex;justify-content:center;padding-top:22px}
.mini-phone{width:178px;height:330px;border-radius:30px;background:#111;padding:5px;box-shadow:0 18px 30px -18px rgba(40,25,10,.6)}
.mini-phone .inner{width:100%;height:100%;border-radius:25px;overflow:hidden;position:relative}
.stack{position:absolute;left:16px;bottom:14px;display:flex}
.stack .st{width:52px;height:52px;border-radius:17px;background:var(--surface);box-shadow:var(--pebble);display:flex;align-items:center;justify-content:center;margin-right:-12px;overflow:hidden;border:2px solid var(--surface)}
.wsfoot{display:flex;align-items:center;gap:14px;padding:16px 18px 18px}
.emo{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.wsname{font-family:var(--serif);font-size:26px;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:20}
.fab:active{transform:translateX(-50%) scale(1.02,.95)}

/* parts */
.partcard{overflow:hidden;cursor:pointer}
.partcard .pw{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.addtile{border:2px dashed rgba(30,26,22,.16);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px;min-height:196px}
.vlink{font-weight:600;color:var(--inkSoft);font-size:12px;display:inline-flex;align-items:center;gap:3px}

/* part screen */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .45s var(--settle),background .3s}
.stage.sunk{transform:scale(.94)}
.topbar{position:absolute;top:58px;left:16px;right:16px;display:flex;align-items:center;gap:8px;z-index:10}
.namep{height:40px;padding:0 16px;font-weight:600;font-size:15px}
.dock{position:absolute;left:16px;right:16px;bottom:30px;z-index:10}
.dockbar{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--surface);box-shadow:var(--pebble)}
.dockbar button{flex:1;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:14px}
.dockbar button.on{background:var(--ink);color:var(--onAccent)}
.tools{display:flex;gap:4px}
.tools button{width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--inkSoft)}
.tools button.on{background:var(--ink);color:var(--onAccent)}
.markpanel{background:var(--surface);border-radius:30px;box-shadow:var(--pebble);padding:12px;display:flex;flex-direction:column;gap:10px;animation:rise .45s var(--settle) both}
canvas.ink{position:absolute;inset:0;touch-action:none;z-index:5}
.ripple{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--accent);pointer-events:none;z-index:8;animation:ripple .7s ease-out forwards}
@keyframes ripple{to{transform:scale(7);opacity:0}}
.notepin{position:absolute;z-index:6;background:var(--surface);border-radius:14px;padding:7px 10px;font-size:13px;font-weight:600;box-shadow:var(--pebble);max-width:170px}
.toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--onAccent);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;animation:toast 2.6s var(--settle) both;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px) scale(.9)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.setpop{animation:setpop .5s var(--settle)}
@keyframes setpop{0%{transform:scale(.96)}100%{transform:scale(1)}}

/* history */
.hist{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 42%,#2A231C 0%,var(--n-bg) 62%);color:var(--n-ink)}
.hist .vnum{font-family:var(--serif);font-size:64px;line-height:62px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.hist .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.hist .spot{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,230,200,.10),transparent)}
.wheel{position:absolute;left:0;right:0;bottom:118px;height:96px;touch-action:none;cursor:grab;z-index:2}
.wheel:active{cursor:grabbing}
.wheel canvas{width:100%;height:100%;display:block}
.needle{position:absolute;left:50%;bottom:130px;width:3px;height:66px;margin-left:-1.5px;border-radius:2px;background:var(--accent);z-index:1;pointer-events:none;box-shadow:0 0 14px rgba(198,90,53,.7)}
.needle::before{content:"";position:absolute;top:-7px;left:-4.5px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.needle.tick{animation:ntick .14s}
@keyframes ntick{50%{transform:scaleY(1.12)}}
.hact{position:absolute;left:16px;right:16px;bottom:34px;display:flex;gap:10px}
.hact .btn{flex:1;padding:0 14px;white-space:nowrap}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(30,22,14,.32);z-index:90;animation:fadein .25s both}
@keyframes fadein{from{opacity:0}}
.sheet{scrollbar-width:none;position:absolute;left:0;right:0;bottom:0;z-index:91;background:var(--surface);border-radius:32px 32px 0 0;padding:10px 20px 34px;max-height:88%;overflow-y:auto;animation:sheetin .5s cubic-bezier(.2,1.2,.4,1) both;box-shadow:0 -10px 40px rgba(40,25,10,.18)}
@keyframes sheetin{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(30,26,22,.14);margin:0 auto 14px}

/* swatches */
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(30,26,22,.10)}
.sw button.on{outline:2px solid var(--accent);outline-offset:3px}
.radio{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--slab);cursor:pointer}
.radio .o{width:22px;height:22px;border-radius:50%;border:2px solid rgba(30,26,22,.2);flex:none}
.radio.on .o{border:7px solid var(--accent)}
.radio.on{outline:2px solid var(--accent);outline-offset:2px}
.prov{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:14px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--well);border-radius:14px;padding:12px 14px;line-height:20px;color:var(--ink)}
.empty{padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.blob{width:64px;height:58px;background:var(--accentSoft);border-radius:48% 52% 45% 55%/55% 45% 55% 45%;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.list-row+.list-row{border-top:1px solid var(--line)}
.switch{width:50px;height:30px;border-radius:15px;background:var(--success);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:23px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .3s var(--settle)}
.switch.off{background:var(--well)}.switch.off::after{left:3px}
</style>
</head>
<body>
<!--
Screens: Home (workspaces) -> Workspace (parts) -> Part (live) -> Mark up -> Mold it -> new version lands
         Part / Workspace -> History "The Wheel" (drag, flick, play, onion-skin) -> Mark up this version | Go back (confirm sheet)
         Home avatar -> Settings & keys (add key sheet, delete confirm) ; Home "New workspace" sheet -> creates workspace
State: one state object, render() redraws; saved to localStorage when available.
Faked: the agent's "molding" is a timed status sequence that adds a version with a small visible change.
-->
<aside class="side">
  <h1>Clay</h1>
  <p>Mold what you make. A clickable prototype of the key screens at iPhone size.</p>
  <nav id="nav"></nav>
  <div class="hint">Try: open Fern → App → <b>v14</b> to turn the Wheel (drag or flick, or press play). Press and hold a part to mark it up.</div>
  <button class="reset" onclick="resetAll()">Reset prototype</button>
</aside>
<div class="phone"><div class="screen" id="screen">
  <div class="status"><span>9:41</span><div class="island"></div><span class="row gap8"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg></span></div>
  <div id="root"></div>
  <div class="home-ind"></div>
</div></div>

<script>
var I = {
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pen:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c2-1 3-4 6-7l7-7a2 2 0 013 3l-7 7c-3 3-6 4-7 6"/><path d="M14 7l3 3"/></svg>',
  scribble:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 15c3-6 5-8 6-6s-3 7-1 8 5-9 7-8-2 7 0 8 4-3 6-5"/></svg>',
  circ:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>',
  arrow:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M10 5h9v9"/></svg>',
  note:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 12a8.5 8.5 0 108.5-8.5c-3 0-5.5 1.5-7 3.8"/><path d="M4 3.5v4h4M12 7.5V12l3 2"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 001.5.9l12-7.5a1 1 0 000-1.8l-12-7.5A1 1 0 007 4.5z"/></svg>',
  pause:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.3"/><rect x="14" y="4" width="4" height="16" rx="1.3"/></svg>',
  goback:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>',

  state.ws='fern'; state.stack=['home'];
  if(k==='workspace') return go('workspace');
  state.stack.push('workspace'); state.part='app';
  if(k==='part') return go('part');
  if(k==='markup'){ state.markup=true; return go('part'); }

/* markup drawing */

function setupInk(){
  var c=document.getElementById('ink'); if(!c) return;
  var r=c.getBoundingClientRect(); var box=c.parentElement; c.width=box.offsetWidth*2; c.height=box.offsetHeight*2;
  c.style.pointerEvents = state.markup ? 'auto' : 'auto';
  var holdT=null;
  function pt(e){ var b=c.getBoundingClientRect(); return {x:(e.clientX-b.left)*(box.offsetWidth/b.width),y:(e.clientY-b.top)*(box.offsetHeight/b.height),t:performance.now()}; }
  c.onpointerdown=function(e){
    if(!state.markup){
      var start=pt(e), sx=e.clientX, sy=e.clientY;
      holdT=setTimeout(function(){ ripple(sx,sy); state.markup=true; haptic('press'); render('none'); },420);
      c.onpointerup=c.onpointerleave=function(){clearTimeout(holdT)};
      return;
    }
    c.setPointerCapture(e.pointerId);
    var p=pt(e);
    if(state.tool==='note'){ var txt=prompt('Note'); if(txt){ marks.push({kind:'note',tag:state.tag,pts:[p],text:txt}); drawMarks(); haptic('press'); } return; }
    cur={kind:state.tool,tag:state.tag,pts:[p]}; marks.push(cur);
    c.onpointermove=function(ev){ if(!cur) return; cur.pts.push(pt(ev)); drawMarks(); };

  };

}
function ripple(x,y){ var s=document.getElementById('screen').getBoundingClientRect(); var d=document.createElement('div'); d.className='ripple'; d.style.left=(x-s.left)+'px'; d.style.top=(y-s.top)+'px'; document.getElementById('screen').appendChild(d); setTimeout(function(){d.remove()},800); }
function drawMarks(){
  var c=document.getElementById('ink'); if(!c) return; var g=c.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,c.width,c.height);
  var pins=document.getElementById('pins'); if(pins) pins.innerHTML='';
  marks.forEach(function(m){
    var col=MARK[m.tag]; g.strokeStyle=col; g.fillStyle=col; g.lineCap='round'; g.lineJoin='round';
    var a=m.pts[0], b=m.pts[m.pts.length-1];
    if(m.kind==='pen'){ for(var i=1;i<m.pts.length;i++){ var p0=m.pts[i-1],p1=m.pts[i]; var sp=Math.hypot(p1.x-p0.x,p1.y-p0.y)/Math.max(1,p1.t-p0.t); g.lineWidth=Math.max(2.5,6-sp*2.2); g.beginPath(); g.moveTo(p0.x,p0.y); g.lineTo(p1.x,p1.y); g.stroke(); } }
    if(m.kind==='circle'){ g.lineWidth=4; g.beginPath(); g.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(10,Math.abs(b.x-a.x)/2),Math.max(10,Math.abs(b.y-a.y)/2),0,0,Math.PI*2); g.globalAlpha=.1; g.fill(); g.globalAlpha=1; g.stroke(); }
    if(m.kind==='arrow'){ var ang=Math.atan2(b.y-a.y,b.x-a.x); g.lineWidth=4.5; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x-16*Math.cos(ang-.45),b.y-16*Math.sin(ang-.45)); g.lineTo(b.x-16*Math.cos(ang+.45),b.y-16*Math.sin(ang+.45)); g.closePath(); g.fill(); }
    if(m.kind==='note' && pins){ var d=document.createElement('div'); d.className='notepin'; d.style.left=a.x+'px'; d.style.top=a.y+'px'; d.style.borderLeft='4px solid '+col; d.textContent=m.text; pins.appendChild(d); }
  });
}
function mold(){
  var note=(document.getElementById('note')||{}).value||'';
  if(!marks.length && !note.trim()){ toast('Draw on it or say what you want'); return; }
  haptic('commit');
  state.markup=false; marks=[];
  var steps=['Reading your marks…','Shaping…','Almost set…'], i=0;
  state.molding=steps[0]; render('none');
  var t=setInterval(function(){
    i++; if(i<steps.length){ state.molding=steps[i]; render('none'); return; }
    clearInterval(t); state.molding=null;
    var pt=part(), lv=latest(pt), p=JSON.parse(JSON.stringify(lv.p));
    if(pt.kind==='app'){ p.radius=Math.min(28,p.radius+4); p.accent = p.accent==='#C65A35'?'#24563B':'#C65A35'; }

  '</div>';

var H={pos:0,vel:0,drag:false,lastX:0,lastT:0,raf:0,idx:-1,la:-1,lb:-1};
var SPACING=46;
function setupWheel(){
  var pt=part(), n=pt.versions.length, el=document.getElementById('wheel'), cv=document.getElementById('wc');
  H.pos=Math.max(0,Math.min(n-1,state.hist.pos)); H.idx=-1; H.la=H.lb=-1; H.vel=0;
  function size(){ var r=el.getBoundingClientRect(); cv.width=r.width*2; cv.height=r.height*2; }
  size();
  el.onpointerdown=function(e){ stopPlay(); el.setPointerCapture(e.pointerId); H.drag=true; H.vel=0; H.lastX=e.clientX; H.lastT=performance.now(); };
  el.onpointermove=function(e){ if(!H.drag) return; var now=performance.now(), dx=e.clientX-H.lastX, scale=el.getBoundingClientRect().width/el.offsetWidth; var d=-dx/scale/SPACING; H.pos=Math.max(-.4,Math.min(n-.6,H.pos+d)); H.vel=d/Math.max(8,now-H.lastT)*16; H.lastX=e.clientX; H.lastT=now; };
  el.onpointerup=el.onpointercancel=function(){ H.drag=false; };
  cancelAnimationFrame(H.raf);
  (function loop(){
    var n=part()&&state.screen==='history' ? part().versions.length : 0; if(!n) return;
    if(!H.drag){
      if(state.playing){ H.pos+=0.06; if(H.pos>=n-1){ H.pos=n-1; stopPlay(); } }
      else if(Math.abs(H.vel)>0.004){ H.pos+=H.vel; H.vel*=0.94; if(H.pos<0||H.pos>n-1){ H.vel*=0.5; } }
      else { var target=Math.round(Math.max(0,Math.min(n-1,H.pos))); H.pos+= (target-H.pos)*0.22; H.vel=0; if(Math.abs(target-H.pos)<0.002) H.pos=target; }
    }
    state.hist.pos=H.pos; drawWheel(); updateStage(); H.raf=requestAnimationFrame(loop);
  })();
}
function drawWheel(){
  var cv=document.getElementById('wc'); if(!cv) return; var g=cv.getContext('2d'), W=cv.width/2, Hh=cv.height/2; g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,W,Hh);
  var pt=part(), n=pt.versions.length, cx=W/2, R=W*0.62, base=Hh-18;
  for(var k=-1; k<=(n-1)*4+1; k++){
    var i=k/4; var dx=(i-H.pos)*SPACING; var ang=dx/R; if(Math.abs(ang)>Math.PI/2*0.98) continue;
    var x=cx+R*Math.sin(ang), f=Math.cos(ang);
    var major = k%4===0 && i>=0 && i<=n-1; var minor=!major && i>0 && i<n-1;
    if(!major && !minor) continue;
    var v=major?pt.versions[i]:null; var newDay = major && i>0 && pt.versions[i-1].day!==v.day;
    var h=(major?(newDay?40:28):12)*(0.45+0.55*f);
    var near=Math.max(0,1-Math.abs(i-H.pos)*1.4);
    g.globalAlpha=Math.pow(f,1.6)*(major?1:.55);
    g.strokeStyle= major ? 'rgba(246,239,230,'+(0.55+0.45*near)+')' : 'rgba(246,239,230,.5)';
    g.lineWidth = major ? 2.2*(0.6+0.4*f) : 1.2; g.lineCap='round';
    g.beginPath(); g.moveTo(x,base); g.lineTo(x,base-h); g.stroke();
    if(major && v.marked){ g.fillStyle=MARK[v.marked]; g.beginPath(); g.arc(x,base-h-8,3.4*(0.6+0.4*f),0,7); g.fill(); }
    if(major && (newDay||i===0)){ g.fillStyle='rgba(140,130,119,1)'; g.font='600 10px Inter, sans-serif'; g.textAlign='center'; g.fillText(['Mon','Tue','Wed','Thu','Fri','Sat','Today'][v.day]||'',x,base+14); }
  }
  g.globalAlpha=1;
}
function updateStage(){
  var pt=part(), w=ws(), n=pt.versions.length;
  var p=Math.max(0,Math.min(n-1,H.pos)), a=Math.floor(p), b=Math.min(n-1,a+1), t=p-a;
  var box=document.getElementById('layers'); if(!box) return; var bw=box.offsetWidth-60, bh=box.offsetHeight;
  var la=document.getElementById('la'), lb=document.getElementById('lb');
  function frame(i){ var v=pt.versions[i]; return pt.kind==='app' ? '<div class="mini-phone" style="width:'+(bh*300/620*0.97+10)+'px;height:'+(bh)+'px;border-radius:30px;padding:5px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)"><div class="inner">'+renderPart(pt,v,bh*300/620*0.97,bh-10,w)+'</div></div>' : '<div style="filter:drop-shadow(0 24px 40px rgba(0,0,0,.6))">'+renderPart(pt,v,Math.min(bw,240),Math.min(bw,240),w)+'</div>'; }
  if(H.la!==a){ la.innerHTML=frame(a); H.la=a; }
  if(H.lb!==b){ lb.innerHTML=frame(b); H.lb=b; }
  la.style.opacity=1; lb.style.opacity= b===a?0:t;
  var idx=Math.round(p);
  if(idx!==H.idx){
    var first=H.idx===-1; H.idx=idx; var v=pt.versions[idx];
    document.getElementById('vnum').textContent=idx+1;
    document.getElementById('vmeta').textContent=(idx===n-1?'Now':ago(pt,idx))+' · '+v.summary;
    var gb=document.getElementById('gobackbtn'); if(gb) gb.style.display= idx===n-1?'none':'';
    if(!first){ haptic(v.marked?'land':'tick'); var nd=document.getElementById('needle'); nd.classList.remove('tick'); void nd.offsetWidth; nd.classList.add('tick'); }
  }
}
function togglePlay(){ if(state.playing){ stopPlay(); return; } if(H.pos>=part().versions.length-1.01) H.pos=0; state.playing=true; document.getElementById('playbtn').innerHTML=I.pause; }

    body='<div class="row between" style="margin-bottom:16px"><div class="heading">New workspace</div><button class="pebble ib sm sq" style="box-shadow:none;background:var(--well)" onclick="closeSheet()" aria-label="Close">'+I.close+'</button></div>'+
    '<div class="row gap12"><button class="emo sq" id="nwemo" style="width:56px;height:56px;font-size:28px;border-radius:19px;background:'+GLAZE[newWs.glaze]+'" onclick="cycleEmoji()" aria-label="Change emoji">'+newWs.emoji+'</button><input class="field" id="nwname" placeholder="Name it" value="'+esc(newWs.name)+'" oninput="newWs.name=this.value;document.getElementById(\'createbtn\').disabled=!this.value.trim()" style="flex:1"></div>'+
    '<div class="sw" style="margin:14px 0 24px">'+Object.keys(GLAZE).map(function(g){return '<button class="sq '+(newWs.glaze===g?'on':'')+'" style="background:'+GLAZE[g]+'" onclick="newWs.glaze=\''+g+'\';drawSheet()" aria-label="'+g+'"></button>'}).join('')+'</div>'+
    '<div class="eyebrow" style="margin-bottom:10px">Key</div><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px">'+
      state.keys.map(function(k){return '<div class="radio sq '+(newWs.key===k.id?'on':'')+'" onclick="newWs.key=\''+k.id+'\';drawSheet()"><div class="o"></div>'+provBadge(k.provider)+'<div style="flex:1"><div style="font-weight:600;font-size:15px">'+esc(k.name)+'</div><div class="caption">'+(k.provider==='openai'?'OpenAI':'Anthropic')+' · …'+k.tail+(k.ok?'':' · not working')+'</div></div></div>'}).join('')+
      '<button class="btn ghost sm sq" style="align-self:flex-start" onclick="openSheet(\'addkey\')">'+I.plus+'Add a key</button></div>'+
    '<div class="eyebrow" style="margin-bottom:10px">App</div>'+segHTML('src',[['connect','Connect my app'],['fresh','Start fresh'],['later','Later']],segState.src)+'<div id="srcinfo">'+srcInfo(segState.src)+'</div>'+
    '<div class="eyebrow" style="margin:24px 0 10px">Logo</div><div class="row gap12">'+logos.map(function(l){return '<button class="sq" onclick="newWs.logo=\''+l[0]+'\';drawSheet()" style="width:64px;height:64px;border-radius:20px;background:var(--well);display:flex;align-items:center;justify-content:center;'+(newWs.logo===l[0]?'outline:2px solid var(--accent);outline-offset:3px':'')+'">'+(l[1]?logoSVG(l[1],46):'<span class="caption">None</span>')+'</button>'}).join('')+'</div>'+
    '<button class="btn accent block sq" id="createbtn" style="margin-top:28px" '+(newWs.name.trim()?'':'disabled')+' onclick="createWs()">Create workspace</button>';
  }
  if(s==='addkey'){
    body='<div class="row between" style="margin-bottom:16px"><div class="heading">Add a key</div><button class="pebble ib sm sq" style="box-shadow:none;background:var(--well)" onclick="closeSheet()" aria-label="Close">'+I.close+'</button></div>'+
      segHTML('prov',[['openai','OpenAI'],['anthropic','Anthropic']],segState.prov)+
      '<input class="field mono" id="keyin" type="password" placeholder="'+(segState.prov==='anthropic'?'sk-ant-…':'sk-…')+'" style="margin-top:14px" autocomplete="off"><div id="keyerr"></div>'+
      '<input class="field" id="keyname" placeholder="Name it" value="Personal" style="margin-top:10px">'+
      '<div class="caption" style="margin-top:10px">Stored only on this phone. Clay shows the last four characters after this.</div>'+
      '<button class="btn accent block sq" style="margin-top:22px" onclick="saveKey()">Save key</button>';
  }
  if(s.indexOf('delkey:')===0){
    var k=keyOf(s.slice(7)), u=usedBy(k.id);
    body='<div class="heading" style="margin-bottom:8px">Delete “'+esc(k.name)+'”?</div><div class="callout" style="margin-bottom:18px">'+(u.length?'These workspaces will need another key before they can change logos and icons: <b style="color:var(--ink)">'+u.map(function(w){return esc(w.name)}).join(', ')+'</b>.':'No workspace uses this key.')+'</div>'+
      '<button class="btn danger block sq" onclick="delKey(\''+k.id+'\')">'+I.trash+'Delete key</button><button class="btn ghost block sq" style="margin-top:6px" onclick="closeSheet()">Keep it</button>';
  }
  if(s==='goback'){
    var pt=part(), idx=Math.round(H.pos);
    body='<div class="heading" style="margin-bottom:8px">Go back to version '+(idx+1)+'?</div><div class="callout" style="margin-bottom:18px">'+(pt.kind==='app'?ws().agent+' will bring the app back to how it looked then.':'The '+pt.name.toLowerCase()+' goes back to how it looked then.')+' This becomes version '+(pt.versions.length+1)+'; everything after it stays in history.</div>'+
      '<button class="btn accent block sq" onclick="goBack()">'+I.goback+'Go back</button><button class="btn ghost block sq" style="margin-top:6px" onclick="closeSheet()">Cancel</button>';
  }
  if(s==='pickkey'){
    var w=ws();
    body='<div class="heading" style="margin-bottom:14px">Key for '+esc(w.name)+'</div><div style="display:flex;flex-direction:column;gap:10px">'+state.keys.map(function(k){return '<div class="radio sq '+(w.key===k.id?'on':'')+'" onclick="ws().key=\''+k.id+'\';closeSheet();render(\'none\');save()"><div class="o"></div>'+provBadge(k.provider)+'<div style="flex:1"><div style="font-weight:600;font-size:15px">'+esc(k.name)+'</div><div class="caption">'+(k.provider==='openai'?'OpenAI':'Anthropic')+' · …'+k.tail+(k.ok?'':' · not working')+'</div></div></div>'}).join('')+'</div>';
  }
  if(s==='ask'){
    body='<div class="heading" style="margin-bottom:12px">Ask about '+part().name+'</div><div class="row gap8" style="flex-wrap:wrap;margin-bottom:12px"><button class="chip sq">Make it feel calmer</button><button class="chip sq">Bigger text</button><button class="chip sq">Match the logo colors</button></div><div class="row gap8"><input class="field" placeholder="Say what you want…" style="flex:1"><button class="btn accent sq" style="width:50px;padding:0" onclick="closeSheet();toast(\'Sent\')" aria-label="Send">'+I.send+'</button></div>';
  }
  host.innerHTML='<div class="scrim" onclick="closeSheet()"></div><div class="sheet"><div class="grab"></div>'+body+'</div>';
  placeThumbs();
}
function cycleEmoji(){ newWs.emoji=EMOJI[(EMOJI.indexOf(newWs.emoji)+1)%EMOJI.length]; haptic('tick'); drawSheet(); }
function createWs(){
  var id='w'+Date.now(), logos={sprout:L({glyph:'leaf',shape:'pebble'}),mono:L({serif:true,letter:(newWs.name[0]||'A').toUpperCase(),bg:'#1E1A16',fg:'#F3EEE6'}),pebble:L({shape:'pebble',bg:'#C65A35',letter:(newWs.name[0]||'A').toUpperCase(),fg:'#FFF8F2'})};
  var parts=[];
  if(segState.src!=='later') parts.push({id:'app',name:'App',kind:'app',versions:[{p:A({title:newWs.name,accent:'#C65A35'}),summary:'First version',day:6}]});
  if(newWs.logo!=='none') parts.push({id:'logo',name:'Logo',kind:'logo',versions:[{p:logos[newWs.logo],summary:'From the template',day:6}],usedIn:parts.length?'App header':undefined});
  if(!parts.length) parts.push({id:'logo',name:'Logo',kind:'logo',versions:[{p:logos.pebble,summary:'From the template',day:6}]});
  state.workspaces.unshift({id:id,name:newWs.name.trim(),emoji:newWs.emoji,glaze:newWs.glaze,key:newWs.key,agent:'Codex',updated:'just now',parts:parts});
  haptic('success'); state.ws=id; state.sheet=null; state.stack=['home']; state.screen='workspace'; render('enter'); toast('Workspace ready'); save();
}
function saveKey(){
  var v=document.getElementById('keyin').value.trim(), nm=document.getElementById('keyname').value.trim()||'Key', p=segState.prov;
  var ok = p==='openai' ? /^sk-[A-Za-z0-9_\-]{8,}$/.test(v) && v.indexOf('sk-ant-')!==0 : /^sk-ant-[A-Za-z0-9_\-]{8,}$/.test(v);
  if(!ok){ document.getElementById('keyerr').innerHTML='<div class="err">That doesn’t look like '+(p==='openai'?'an OpenAI key. It starts with sk-':'an Anthropic key. It starts with sk-ant-')+'.</div>'; haptic('error'); return; }
  state.keys.push({id:'k'+Date.now(),provider:p,name:nm,tail:v.slice(-4),ok:true}); haptic('success');
  var back = state.screen!=='settings' && state.workspaces; state.sheet=null;
  if(state.screen==='home'){ render('none'); openSheet('new'); newWs.key=state.keys[state.keys.length-1].id; drawSheet(); } else { render('none'); }
  toast('Key saved'); save();
}
function delKey(id){ state.keys=state.keys.filter(function(k){return k.id!==id}); state.workspaces.forEach(function(w){ if(w.key===id) w.key=null; }); state.sheet=null; haptic('commit'); render('none'); toast('Key deleted'); save(); }

/* ---------- render ---------- */
function toast(t){ state.toast=t; var o=document.querySelector('.toast'); if(o) o.remove(); var d=document.createElement('div'); d.className='toast'; d.textContent=t; document.getElementById('screen').appendChild(d); setTimeout(function(){d.remove()},2700); state.toast=null; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function render(anim){
  var root=document.getElementById('root'), scr=document.getElementById('screen');
  var html = state.screen==='home'?vHome(): state.screen==='workspace'?vWorkspace(): state.screen==='part'?vPart(): state.screen==='history'?vHistory(): vSettings();
  scr.classList.toggle('dark', state.screen==='history');
  var keepScroll = anim==='none' && root.firstChild ? root.firstChild.scrollTop : 0;
  root.innerHTML='<div class="view '+(anim==='none'?'':anim)+'">'+html+'</div><div id="sheethost"></div>';
  if(anim==='none') root.firstChild.scrollTop=keepScroll;
  if(anim==='none') { var r=root.querySelector('.rise'); if(r) r.classList.remove('rise'); }
  drawSheet(); placeThumbs(); drawNav();
  if(state.screen==='part'){ setupInk(); }
  if(state.screen==='history'){ setupWheel(); }
  if(state.toast){ var t=state.toast; state.toast=null; toast(t); }
}
window.addEventListener('resize',function(){ if(state.screen==='history') setupWheel(); placeThumbs(); });
render('enter');
</script>
</body>
</html>
