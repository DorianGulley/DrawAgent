<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daybook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="screen">
    <header class="header">
      <span class="badge" id="date-badge">Today</span>
      <h1 class="title">Hi, Jordan</h1>
    </header>

    <section class="focus-card">
      <p class="focus-label">Deep work</p>
      <h2 class="focus-timer" id="timer">25:00</h2>
      <button class="focus-button" id="focus-button">Start focus</button>
    </section>

    <section class="stats">
      <div class="stat"><span class="stat-value">6.2k</span><span class="stat-label">Steps</span></div>
      <div class="stat"><span class="stat-value">7h 40m</span><span class="stat-label">Sleep</span></div>
      <div class="stat"><span class="stat-value">Great</span><span class="stat-label">Mood</span></div>
    </section>

    <section class="tasks">
      <h2 class="section-title">Top priorities</h2>
      <ul class="task-list" id="task-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
